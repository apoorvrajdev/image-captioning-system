name: Deploy backend to HuggingFace Space

# The Space is a deployment target, not a source repository (ADR-017). Each
# deploy force-pushes a generated single-commit snapshot: the build context of
# the CI-tested GitHub commit plus the Space's README config header, with no
# GitHub history (ADR-030). It only succeeds once the Space reports RUNNING,
# /healthz reports model_loaded: true and a real caption succeeds (ADR-028).
# A commit that changes no image input since the last successful deploy skips
# the rebuild (ADR-027).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  actions: read       # manual runs look up the CI result for the exact commit
  deployments: write  # the deploy record: read as the baseline, written after the health gate

jobs:
  push-to-space:
    name: Deploy tested commit to HF Space
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    # Manual dispatch is limited to main: a force push from any other branch
    # would deploy code that never passed CI on main. Manual runs must also
    # pass the CI-verification step below.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      HF_USERNAME: apoorvrajdev
      HF_SPACE: image-captioning-api
      # workflow_run: the exact commit the CI run tested.
      # workflow_dispatch: the commit at the tip of main, deployed only if that
      # exact commit has a successful CI run (verified in the first step).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # workflow_run deploys are CI-verified by their trigger. Manual runs are
      # verified here, before anything is checked out, built, or pushed: the
      # exact DEPLOY_SHA needs a completed, successful CI run on main. A
      # success for any other commit doesn't count, and an API error refuses.
      - name: Verify the requested commit passed CI (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_WORKFLOW_FILE: ci.yml
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          sha = os.environ["DEPLOY_SHA"]
          url = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                 f"/actions/workflows/{os.environ['CI_WORKFLOW_FILE']}/runs?head_sha={sha}&per_page=100")
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response).get("workflow_runs") or []
          except (urllib.error.URLError, TimeoutError, ValueError) as exc:
              print(f"::error::Could not query CI runs for {sha} ({type(exc).__name__}); refusing to deploy")
              sys.exit(1)

          # Re-check every field rather than trusting the API's head_sha filter.
          verified = [r for r in runs
                      if r.get("head_sha") == sha and r.get("head_branch") == "main"
                      and r.get("status") == "completed" and r.get("conclusion") == "success"]
          if not verified:
              seen = ", ".join(
                  f"{str(r.get('head_sha'))[:7]}@{r.get('head_branch')} {r.get('status')}/{r.get('conclusion')}"
                  for r in runs) or "none"
              print(f"::error::{sha} has no completed, successful CI run on main "
                    f"(runs found: {seen}); refusing to deploy")
              sys.exit(1)
          print(f"CI verified {sha}: {verified[0].get('html_url')}")
          PY

      # Full history for the scope decision's diff against the last deploy. None of
      # it reaches the Space: the snapshot below holds only the tested tree.
      - name: Checkout the tested commit (full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          # Nothing here pushes to GitHub, so the token (which can write deploy
          # records) stays out of .git/config and reaches only the steps given it.
          persist-credentials: false

      # With force-push, an older CI run finishing after a newer one would roll
      # the Space back. Only the current tip of main is deployed; a superseded
      # commit is skipped because the newer commit's own CI run deploys it.
      - name: Skip commits already superseded on main
        id: guard
        run: |
          tip=$(git rev-parse origin/main)
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && [ "$tip" != "$DEPLOY_SHA" ]; then
            echo "::notice::main is at ${tip}; ${DEPLOY_SHA} is superseded and will not be deployed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Rebuild only if an image input changed since the last deploy that passed
      # the health gate, read from the huggingface-space deployment record and
      # never from the parent commit (ADR-027). A skip also needs the Space to
      # still be on the commit that deploy pushed. No record, an API error or an
      # unknown commit deploys. Manual runs always deploy. Every step below runs
      # only when this one outputs deploy=true.
      - name: Decide whether the image changed since the last successful deploy
        id: scope
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python3 -m scripts.deploy_scope decide --head "$DEPLOY_SHA" --space "$HF_USERNAME/$HF_SPACE" --force
          else
            python3 -m scripts.deploy_scope decide --head "$DEPLOY_SHA" --space "$HF_USERNAME/$HF_SPACE"
          fi

      # The Space gets one root commit: the build context (BUILD_CONTEXT in
      # scripts/deploy_scope.py) of DEPLOY_SHA, with the Space's README config
      # header, and no GitHub history (ADR-030). Hugging Face refuses a push that
      # carries binary files outside Xet/LFS, and GitHub's history holds some (the
      # README demo video). The snapshot is built in its own repository under
      # RUNNER_TEMP, so the checkout isn't modified. It refuses, before anything is
      # pushed, an incomplete build context and binary, LFS, secret- or cache-like
      # files. Its commit message names DEPLOY_SHA (Source-Commit), and it sets
      # DEPLOY_COMMIT and SNAPSHOT_DIR for the steps below.
      - name: Build the Space snapshot of the tested commit
        if: steps.scope.outputs.deploy == 'true'
        env:
          GIT_AUTHOR_NAME: apoorvrajdev
          GIT_AUTHOR_EMAIL: apoorvrajmgr@gmail.com
          GIT_COMMITTER_NAME: apoorvrajdev
          GIT_COMMITTER_EMAIL: apoorvrajmgr@gmail.com
        run: python3 -m scripts.space_snapshot --sha "$DEPLOY_SHA" --dest "$RUNNER_TEMP/space-snapshot"

      # Force-push is intentional (ADR-017): each deploy replaces the Space's
      # history with the new snapshot (ADR-030). Space variables and secrets live
      # in Space settings, not git, and are untouched. The token reaches git only
      # through GIT_ASKPASS, so it is never in a URL, a git config file or a log.
      - name: Force-push the snapshot to the Space
        if: steps.scope.outputs.deploy == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::HF_TOKEN secret is not set. Add it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          # An empty source would turn the push into a deletion of the Space's main.
          if ! printf '%s' "${DEPLOY_COMMIT:-}" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::No snapshot commit to push (DEPLOY_COMMIT='${DEPLOY_COMMIT:-}')."
            exit 1
          fi
          askpass="$RUNNER_TEMP/hf-askpass.sh"
          printf '#!/bin/sh\nprintf "%%s" "$HF_TOKEN"\n' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -C "$SNAPSHOT_DIR" push --force \
            "https://${HF_USERNAME}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" \
            "${DEPLOY_COMMIT}:refs/heads/main"

      # A successful push is not a successful deploy (the Space ended up in
      # CONFIG_ERROR while pushes still reported success). The runtime API
      # reports no build SHA, so a stage seen before any build stage may be
      # left over from the previous commit and is not trusted until
      # BUILD_START_TIMEOUT has passed.
      - name: Wait for the Space to build and report healthy
        id: health
        if: steps.scope.outputs.deploy == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          POLL_SECONDS: "15"
          BUILD_START_TIMEOUT: "600"   # s to observe a rebuild of the new commit
          RUNNING_TIMEOUT: "1800"      # s for build + startup (first builds take ~8-12 min)
          HEALTH_TIMEOUT: "600"        # s for /healthz to report model_loaded: true
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          API = f"https://huggingface.co/api/spaces/{os.environ['HF_USERNAME']}/{os.environ['HF_SPACE']}"
          TOKEN = os.environ["HF_TOKEN"]
          EXPECTED = os.environ["DEPLOY_COMMIT"]
          POLL = int(os.environ["POLL_SECONDS"])
          BUILD_START_TIMEOUT = int(os.environ["BUILD_START_TIMEOUT"])
          RUNNING_TIMEOUT = int(os.environ["RUNNING_TIMEOUT"])
          HEALTH_TIMEOUT = int(os.environ["HEALTH_TIMEOUT"])
          ERROR_STAGES = {"CONFIG_ERROR", "BUILD_ERROR", "RUNTIME_ERROR", "NO_APP_FILE",
                          "STOPPED", "PAUSED", "DELETING"}


          def get_json(url, auth=True):
              headers = {"Authorization": f"Bearer {TOKEN}"} if auth else {}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as r:
                      return json.load(r)
              except (urllib.error.URLError, TimeoutError, ValueError) as exc:
                  print(f"  request failed ({type(exc).__name__}); retrying")
                  return None


          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)


          # 1. The Space repo must be on the commit that was just pushed.
          deadline = time.monotonic() + 120
          while True:
              head = (get_json(API) or {}).get("sha")
              if head == EXPECTED:
                  print(f"Space head is the deployment commit {EXPECTED}")
                  break
              if time.monotonic() >= deadline:
                  fail(f"Space head is {head}, expected {EXPECTED}")
              time.sleep(5)

          # 2. Wait for a rebuild of the new commit to start, then for RUNNING.
          start = time.monotonic()
          seen_build = False
          domain = None
          while True:
              elapsed = int(time.monotonic() - start)
              runtime = get_json(f"{API}/runtime") or {}
              stage = runtime.get("stage", "UNKNOWN")
              for entry in runtime.get("domains") or []:
                  domain = entry.get("domain") or domain
              print(f"[{elapsed:>5}s] stage={stage}")
              if stage == "RUNNING":
                  if seen_build:
                      break
                  if elapsed >= BUILD_START_TIMEOUT:
                      fail(f"Space reports RUNNING but no rebuild of {EXPECTED} was observed "
                           f"within {BUILD_START_TIMEOUT}s; refusing to trust a stale state")
              elif stage in ERROR_STAGES:
                  if seen_build or elapsed >= BUILD_START_TIMEOUT:
                      fail(f"Space entered {stage}: {runtime.get('errorMessage') or 'no error message'}")
              elif stage not in ("UNKNOWN", "SLEEPING"):
                  seen_build = True  # BUILDING, RUNNING_BUILDING, APP_STARTING, ...
              if elapsed >= RUNNING_TIMEOUT:
                  fail(f"Space did not reach RUNNING within {RUNNING_TIMEOUT}s (last stage {stage})")
              time.sleep(POLL)

          # 3. Healthy means the predictor is loaded, not just an HTTP 200.
          if not domain:
              fail("runtime API returned no Space domain")
          # The host pattern scripts/smoke_caption.py accepts (HOST_PATTERN).
          if not re.fullmatch(r"[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+", domain):
              fail(f"runtime API returned an unexpected Space domain {domain!r}")
          url = f"https://{domain}/healthz"
          start = time.monotonic()
          while True:
              body = get_json(url, auth=False)
              if isinstance(body, dict) and body.get("model_loaded") is True:
                  print(f"Healthy: model_version={body.get('model_version')} "
                        f"api_version={body.get('api_version')}")
                  break
              if time.monotonic() - start >= HEALTH_TIMEOUT:
                  fail(f"{url} did not report model_loaded: true within {HEALTH_TIMEOUT}s "
                       f"(last response: {body})")
              time.sleep(POLL)

          # The smoke test captions on the same host this gate just checked.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"space_url=https://{domain}\n")
          PY

      # One real caption from the live Space (TASK-023, ADR-028). /healthz shows
      # the model loaded; this shows the deployed container can caption with it,
      # with the response contract, request-id echo and the SPA's CORS origin
      # checked. A failure fails the deploy, so the baseline below isn't recorded.
      - name: Smoke-test a real caption on the live Space
        if: steps.scope.outputs.deploy == 'true'
        timeout-minutes: 10
        env:
          SPACE_URL: ${{ steps.health.outputs.space_url }}
          FRONTEND_ORIGIN: https://image-captioning-system.vercel.app
        run: python3 -m scripts.smoke_caption --url "$SPACE_URL" --origin "$FRONTEND_ORIGIN"

      # The baseline the next run compares against (ADR-027). This runs only after
      # every step above succeeded, so only a Space that is RUNNING and healthy on
      # this commit is recorded. A failed, cancelled or skipped run records nothing
      # and its changes stay in the next run's range.
      - name: Record the deployed commit as the new baseline
        if: steps.scope.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -m scripts.deploy_scope record
          --sha "$DEPLOY_SHA"
          --space-commit "$DEPLOY_COMMIT"
          --space "$HF_USERNAME/$HF_SPACE"
